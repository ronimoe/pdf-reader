# M0c platform probe. Standalone: not part of Lectern.xcodeproj.
# Generate with `xcodegen generate` in this directory (scripts/lib.sh does it).
#
# PlatformProbe        same entitlements, sandbox, hardened runtime and ad-hoc
#                      signing as the Lectern app (experiments 1-3, 5).
# PlatformProbeSparkle the same probe plus Sparkle 2 and the extra sandbox
#                      entitlements Sparkle needs (experiment 4). Separate
#                      bundle ID so its container never mixes with the above.
name: PlatformProbe
options:
  bundleIdPrefix: io.github.ronimoe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Same signing as Lectern (docs/architecture.md §8): ad-hoc, hardened runtime.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Overridden on the xcodebuild command line by scripts/lib.sh (build_probe).
    PROBE_BUILD_TAG: v1
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  PlatformProbe:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - Probe/Sources
    settings:
      base:
        PRODUCT_NAME: PlatformProbe
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronimoe.PlatformProbe
        INFOPLIST_FILE: Probe/Info.plist
        CODE_SIGN_ENTITLEMENTS: Probe/PlatformProbe.entitlements
        GENERATE_INFOPLIST_FILE: NO
  PlatformProbeSparkle:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - Probe/Sources
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: PlatformProbeSparkle
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronimoe.PlatformProbeSparkle
        INFOPLIST_FILE: Probe/Info-Sparkle.plist
        CODE_SIGN_ENTITLEMENTS: Probe/PlatformProbeSparkle.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PROBE_SPARKLE"
        # Overridden by scripts/04-sparkle.sh.
        SPARKLE_FEED_URL: "http://127.0.0.1:8765/appcast.xml"
        SPARKLE_PUBLIC_ED_KEY: ""
