name: Lectern
options:
  bundleIdPrefix: io.github.ronimoe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Product name Lectern and bundle ID io.github.ronimoe.Lectern, decided 2026-10-30 (docs/decisions.md).
    # Release version (docs/release-checklist.md). CURRENT_PROJECT_VERSION is the build number
    # Sparkle compares (CFBundleVersion): a whole number that goes up by one with every release.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Unsigned distribution (ad-hoc). See docs/architecture.md §8.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
packages:
  LecternKit:
    path: Packages/LecternKit
  # Opt-in updates (A4, docs/architecture.md §7). MIT. Pinned to the version
  # M0c and M5 tested end to end with ad-hoc signed builds. The only dynamic
  # framework in the app; it needs disable-library-validation (§6).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Lectern:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # Shipped inside the app (Help menu, About): the GPL-3.0, third-party notices (Sparkle's
      # MIT licence), and the known limitations. scripts/release/verify-dmg checks all three.
      - path: LICENSE
        buildPhase: resources
      - path: App/Resources/Acknowledgements.txt
        buildPhase: resources
      - path: docs/known-limitations.md
        buildPhase: resources
      # The app icon, an Icon Composer document (design/logo/README.md).
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: LecternKit
        product: ReaderCore
      - package: LecternKit
        product: PDFSave
      - package: LecternKit
        product: Persistence
      - package: LecternKit
        product: ReaderKit
      - package: LecternKit
        product: ReaderUI
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Lectern
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronimoe.Lectern
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Lectern.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # No get-task-allow in shipped builds (keeps the hardened runtime meaningful).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  LecternTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      # A real arXiv paper for the M3 link tests. The test host is sandboxed,
      # so it reads the paper from its own bundle, not the repository.
      - path: Tests/Corpus/public/realworld/arxiv-2310.12457v2.pdf
        buildPhase: resources
      # M4b: saving annotations end to end, on generated and real-world files.
      - path: Tests/Corpus/public/realworld/arxiv-2208.04284v5.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/realworld/arxiv-2402.16746v1.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/realworld/arxiv-2502.20639v1.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/realworld/arxiv-2503.00201v1.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/realworld/nasa-tm-20180002207.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/realworld/nasa-tm-2020-220520.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/classic-xref.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/signed-approval.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/certified-docmdp.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-aes256.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-aes256-owner-only.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/acroform-filled.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/third-party-annots.pdf
        buildPhase: resources
      # M7: saving into encrypted files.
      - path: Tests/Corpus/public/encrypted-r2-rc4-40.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r3-rc4-annotated.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r4-rc4.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r4-aes128-objstm.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r4-cleartext-metadata.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r4-identity-strings.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r6-objstm-restricted.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r6-unicode.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-signed.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-r5.pdf
        buildPhase: resources
      - path: Tests/Corpus/public/encrypted-pubkey.pdf
        buildPhase: resources
    dependencies:
      - target: Lectern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ronimoe.LecternTests
        GENERATE_INFOPLIST_FILE: YES
        # Installs the UI tripwire before any test runs: no test may show an alert or panel.
        INFOPLIST_KEY_NSPrincipalClass: LecternTestPrincipal
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lectern.app/Contents/MacOS/Lectern"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  Lectern:
    build:
      targets:
        Lectern: all
        LecternTests: [test]
    test:
      targets:
        - LecternTests
